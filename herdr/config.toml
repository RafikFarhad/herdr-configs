onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-deck.open"
description = "open herdr-deck"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "herdr-deck.new-session"
description = "herdr-deck: new session for this card"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-deck.assign"
description = "herdr-deck: file this pane's session under a card"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-deck.goto"
description = "herdr-deck: show this pane's card"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
  [{ token = "$topic", bold = true, dim = false }],
  [{ token = "$summary", dim = true }, "$progress"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", { token = "tab", rules = [{ equals = "Agent", hide = true }, { starts_with = "Reviewer #", hide = true }] }],
  ["agent"],
  [{ token = "$summary", dim = true }, "$progress"],
]

